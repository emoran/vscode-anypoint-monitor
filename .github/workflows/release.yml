name: Release & Publish

# Publishes to the VS Code Marketplace when a version tag is pushed (e.g. v0.0.71),
# or manually via the Actions tab. A GitHub Release with the packaged .vsix is also created.
#
# Required repository secrets:
#   VSCE_TOKEN                                  - Azure DevOps PAT with Marketplace "Manage" scope for the publisher.
#   ANYPOINT_SECRETS_JSON                       - base64 of config/secrets.json (region OAuth client ids/secrets).
#   ANYPOINT_MONITOR_APPINSIGHTS_CONNECTION_STRING - (optional) App Insights connection string for telemetry.
#
# Release flow:
#   1. Bump "version" in package.json (and CHANGELOG.md), commit, push to main.
#   2. git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the VS Code Marketplace'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Materialize config/secrets.json
        shell: bash
        env:
          ANYPOINT_SECRETS_JSON: ${{ secrets.ANYPOINT_SECRETS_JSON }}
        run: |
          if [ -z "$ANYPOINT_SECRETS_JSON" ]; then
            echo "::error::Missing ANYPOINT_SECRETS_JSON secret (base64 of config/secrets.json). Cannot build a publishable package."
            exit 1
          fi
          mkdir -p config
          echo "$ANYPOINT_SECRETS_JSON" | base64 --decode > config/secrets.json
          node -e "
            const s = JSON.parse(require('fs').readFileSync('config/secrets.json','utf8'));
            const id = s.us && s.us.CLIENT_ID, secret = s.us && s.us.CLIENT_SECRET;
            if (!id || !secret) {
              console.error('::error::config/secrets.json is missing us.CLIENT_ID / us.CLIENT_SECRET. The published extension would fail OAuth with \"missing client_id parameter\". Fix the ANYPOINT_SECRETS_JSON secret (base64 of the real config/secrets.json).');
              process.exit(1);
            }
            console.log('config/secrets.json is valid and has us credentials.');
          "

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json or fix the tag."
            exit 1
          fi
          echo "Tag and package version match: ${PKG_VERSION}"

      - name: Package VSIX
        shell: bash
        env:
          ANYPOINT_MONITOR_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.ANYPOINT_MONITOR_APPINSIGHTS_CONNECTION_STRING }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce package -o "anypoint-monitor-${VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: '*.vsix'
          retention-days: 30

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing VSCE_TOKEN secret. Cannot publish."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce publish --packagePath "anypoint-monitor-${VERSION}.vsix"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
