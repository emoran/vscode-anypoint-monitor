name: Test Extension

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # config/secrets.json is gitignored, but src/constants.ts imports it at compile time.
      # Use real region creds when the secret is available (maintainer builds), otherwise
      # fall back to an empty template so contributor PRs can still compile and test.
      - name: Prepare config/secrets.json
        shell: bash
        env:
          ANYPOINT_SECRETS_JSON: ${{ secrets.ANYPOINT_SECRETS_JSON }}
        run: |
          mkdir -p config
          if [ -n "$ANYPOINT_SECRETS_JSON" ]; then
            echo "$ANYPOINT_SECRETS_JSON" | base64 --decode > config/secrets.json
          else
            echo '{"us":{"CLIENT_ID":"","CLIENT_SECRET":""},"eu":{"CLIENT_ID":"","CLIENT_SECRET":""},"gov":{"CLIENT_ID":"","CLIENT_SECRET":""}}' > config/secrets.json
          fi

      - name: Run linter
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            out/test/**/*.js
            test-results.xml
          retention-days: 30

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prepare config/secrets.json
        shell: bash
        env:
          ANYPOINT_SECRETS_JSON: ${{ secrets.ANYPOINT_SECRETS_JSON }}
        run: |
          mkdir -p config
          if [ -n "$ANYPOINT_SECRETS_JSON" ]; then
            echo "$ANYPOINT_SECRETS_JSON" | base64 --decode > config/secrets.json
          else
            echo '{"us":{"CLIENT_ID":"","CLIENT_SECRET":""},"eu":{"CLIENT_ID":"","CLIENT_SECRET":""},"gov":{"CLIENT_ID":"","CLIENT_SECRET":""}}' > config/secrets.json
          fi

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prepare config/secrets.json
        shell: bash
        env:
          ANYPOINT_SECRETS_JSON: ${{ secrets.ANYPOINT_SECRETS_JSON }}
        run: |
          mkdir -p config
          if [ -n "$ANYPOINT_SECRETS_JSON" ]; then
            echo "$ANYPOINT_SECRETS_JSON" | base64 --decode > config/secrets.json
          else
            echo '{"us":{"CLIENT_ID":"","CLIENT_SECRET":""},"eu":{"CLIENT_ID":"","CLIENT_SECRET":""},"gov":{"CLIENT_ID":"","CLIENT_SECRET":""}}' > config/secrets.json
          fi

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: '*.vsix'
          retention-days: 30
